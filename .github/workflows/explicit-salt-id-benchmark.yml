# Fork-only experiment; not intended for the upstream fixture patch.
name: Explicit Salt ID comparison
on:
  push:
    branches: [codex/explicit-salt-ids]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    if: github.repository == 'ITJamie/salt'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install test requirements
        run: |
          python -m pip install -r requirements/base.txt -r requirements/pytest.txt
          python -m pip freeze > dependencies.txt
      - name: Measure existing tests twice
        shell: bash
        run: |
          mkdir -p artifacts
          cp dependencies.txt artifacts/
          for trial in 1 2; do
            python .github/scripts/salt_id_benchmark.py "artifacts/trial-${trial}.json" \
              -vv --durations=20 --timeout=180 -o timeout_func_only=false \
              -o faulthandler_timeout=60 \
              --junitxml="artifacts/junit-${trial}.xml" \
              --log-file="artifacts/pytest-${trial}.log" --log-file-level=DEBUG
          done
      - name: Retain measurements and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: explicit-salt-ids-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
